<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SOS: an unnecessarily intelligent way to prepare one ordinary Google search.">
  <meta name="theme-color" content="#ffffff">
  <title>SOS — Search Oriented Shortcut</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20261021-1">
  <script src="script.js?v=20261021-1" defer></script>
</head>
<body>
  <div class="brand-cursor" data-brand-cursor aria-hidden="true">
    <svg viewBox="0 0 64 64" role="presentation">
      <g transform="rotate(-45 32 32)">
        <path class="cursor-aa-outline" d="M8 31 32 7l24 24M32 8v49M15 27q17-9 34 0"/>
        <path class="cursor-aa-face" d="M8 31 32 7l24 24M32 8v49M15 27q17-9 34 0"/>
      </g>
    </svg>
  </div>

  <main id="app" class="app" data-state="idle">
    <section class="search-home" aria-labelledby="page-title">
      <div class="wordmark" data-wordmark>
        <h1 id="page-title"><span>S</span><span>O</span><span>S</span></h1>
        <p class="definition">Search Oriented Shortcut</p>
        <p class="system-result" aria-live="polite"><strong>System Overstimulated…</strong> Redirecting.</p>
      </div>

      <form class="search-form" data-form novalidate>
        <label class="sr-only" for="query">What should we search for?</label>
        <div class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.1-5.4a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
          <input id="query" name="q" type="search" autocomplete="off" maxlength="300" placeholder="Search for something" required>
          <div class="search-tools">
            <button class="sound-toggle" type="button" data-sound aria-label="Toggle typing sounds" aria-pressed="true" title="Typing sounds on">♪</button>
            <a class="ai-mode" href="https://www.youtube.com/watch?v=nZ-IGlZKECI" target="_blank" rel="noopener noreferrer" title="AI Stepover mode — opens YouTube"><span aria-hidden="true">✦</span> AI Stepover</a>
          </div>
          <button class="clear" type="button" data-clear aria-label="Clear question">×</button>
        </div>
        <p class="validation" data-validation hidden>Please provide something for the intelligence to overprocess.</p>
        <div class="actions">
          <button class="primary" type="submit">SOS Found</button>
          <button class="secondary" type="button" data-copy aria-label="Copy an SOS search link">SOS Lost</button>
        </div>
        <p class="powered-by">Powered by <strong>AI: Andraoid Intelligence</strong><span>A new learning language model by Andrew Andrade</span></p>
      </form>

      <div class="processor" data-processor hidden>
        <div class="processor-heading">
          <span>Andraoid Intelligence Engine</span>
          <output data-percent>0%</output>
        </div>
        <div class="progress" role="progressbar" aria-label="Search preparation" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-progress>
          <span data-progress-fill></span>
        </div>
        <div class="status-log" data-status aria-live="polite" aria-label="Andraoid Intelligence activity"></div>
        <a class="skip" data-google-link href="https://www.google.com/">Skip the intelligence</a>
      </div>

      <output class="share-output" data-share-output></output>
    </section>
  </main>
</body>
</html>
